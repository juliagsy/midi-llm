name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[repr,dev]"
      # AMT (git dep), LoRA training, and musicinstruct scoring are not exercised here;
      # they require optional extras, HF model access, and the sibling musicinstruct repo.
      - name: Ruff
        run: ruff check midi_llm tests
      - name: Pytest
        run: pytest tests/ -q
